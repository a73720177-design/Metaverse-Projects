name: Project CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "llm-service/**"
      - "src/**"
      - "index.html"
      - "style.css"
      - "vite.config.js"
      - "package.json"
      - "package-lock.json"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - "llm-service/**"
      - "src/**"
      - "index.html"
      - "style.css"
      - "vite.config.js"
      - "package.json"
      - "package-lock.json"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: project-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: backend
    env:
      REPOSITORY_MODE: memory
      OBJECT_STORAGE_MODE: local
      DB_AUTO_CREATE: "false"
      RAG_MODE: lexical
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install Backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Backend sources
        run: python -m compileall -q app tests
      - name: Run Backend tests
        run: python -m pytest -q

  llm:
    name: LLM Service
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: llm-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            llm-service/requirements.txt
            llm-service/requirements-dev.txt
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install LLM dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile LLM sources
        run: python -m compileall -q app tests
      - name: Run LLM tests
        run: python -m pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
      - name: Install Frontend dependencies
        run: npm ci
      - name: Run Frontend tests
        run: npm test
      - name: Build Frontend
        run: npm run build
