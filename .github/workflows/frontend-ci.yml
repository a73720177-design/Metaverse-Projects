name: Frontend CI

on:
  workflow_dispatch:
  push:
    branches:
      - imjae-frontend-integration
      - Frontend-main
    paths:
      - "src/**"
      - "index.html"
      - "style.css"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches:
      - Frontend-main
      - main
    paths:
      - "src/**"
      - "index.html"
      - "style.css"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Node build and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=moderate
