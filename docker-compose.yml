services:
  postgres:
    image: postgres:16-alpine
    container_name: metaverse-postgres
    environment:
      POSTGRES_DB: qwendb
      POSTGRES_USER: qwen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_postgres_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qwen -d qwendb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

